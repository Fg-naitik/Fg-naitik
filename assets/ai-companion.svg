<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="650" viewBox="0 0 1500 650" role="img" aria-labelledby="ghost-title ghost-desc">
<title id="ghost-title">NAITIK.EXE — GHOST Tactical AI Companion</title>
<desc id="ghost-desc">Toji-inspired Emerald Killer tactical GHOST companion interface providing click-only developer telemetry and direct mission directives.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#080A09"/>
    <stop offset=".55" stop-color="#0F2418"/>
    <stop offset="1" stop-color="#040E08"/>
  </linearGradient>
  <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#00FF9C"/>
    <stop offset=".55" stop-color="#00A86B"/>
    <stop offset="1" stop-color="#040E08"/>
  </linearGradient>
  <linearGradient id="bright-line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00A86B"/>
    <stop offset=".5" stop-color="#00FF9C"/>
    <stop offset="1" stop-color="#00A86B"/>
  </linearGradient>
  <radialGradient id="core">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset=".3" stop-color="#00FF9C"/>
    <stop offset=".7" stop-color="#00A86B"/>
    <stop offset="1" stop-color="#080A09"/>
  </radialGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
    <path d="M34 0H0V34" fill="none" stroke="#00A86B" stroke-opacity=".12"/>
  </pattern>
  <clipPath id="frame"><rect x="5" y="5" width="1490" height="640" rx="24"/></clipPath>
</defs>

<g clip-path="url(#frame)">
  <!-- Deep Base Surface -->
  <rect width="1500" height="650" fill="url(#bg)"/>
  <rect width="1500" height="650" fill="url(#grid)"/>

  <!-- Ambient Cursed Sparkles -->
  <g fill="#00FF9C">
    <circle cx="88" cy="145" r="1.6"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="90" r="1.4"><animate attributeName="opacity" values=".2;.9;.2" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="105" r="1.5"><animate attributeName="opacity" values=".2;1;.2" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="1390" cy="180" r="1.8"><animate attributeName="opacity" values=".2;1;.2" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="1260" cy="560" r="1.3"><animate attributeName="opacity" values=".2;.9;.2" dur="3.7s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Header -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="58" y="60" fill="#D5DED8" font-size="27" font-weight="800" letter-spacing="2">NAITIK.EXE  //  GHOST COMPANION</text>
    <text x="60" y="91" fill="#84928A" font-size="13" font-weight="700" letter-spacing="1.5">TACTICAL DEVELOPER UPLINK • EMERALD KILLER EDITION</text>
    <circle cx="1410" cy="57" r="5" fill="#00FF9C" filter="url(#soft)">
      <animate attributeName="opacity" values="1;.25;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="1435" y="62" fill="#00FF9C" font-size="13" font-weight="750" text-anchor="end" letter-spacing="1">GHOST ACTIVE</text>
  </g>
  <path d="M55 115H1445" stroke="url(#bright-line)" stroke-opacity=".55" stroke-width="1.5"/>

  <!-- Holographic GHOST Tactical Operator (Preserved Operator Silhouette) -->
  <g transform="translate(320 355)">
    <!-- Expanding Outer Aura -->
    <circle r="210" fill="#00FF9C" opacity=".045" filter="url(#glow)">
      <animate attributeName="r" values="195;215;195" dur="5s" repeatCount="indefinite"/>
    </circle>
    <!-- Rotating Tactical HUD Rings -->
    <circle r="172" fill="none" stroke="#00FF9C" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="5 10">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="36s" repeatCount="indefinite"/>
    </circle>
    <ellipse rx="150" ry="178" fill="none" stroke="#00A86B" stroke-opacity=".4" stroke-width="2" stroke-dasharray="3 12">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="28s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="125" ry="145" fill="none" stroke="#00FF9C" stroke-opacity=".25" stroke-width="1.2"/>
    <path d="M-155 0H155M0-175V175" stroke="#00FF9C" stroke-opacity=".12"/>

    <!-- Head Helmet Silhouette -->
    <path d="M-105-62 Q-105-145 0-154 Q105-145 105-62 L93 70 Q75 142 0 154 Q-75 142-93 70Z"
          fill="#0D2217" stroke="url(#emerald)" stroke-width="3" filter="url(#soft)"/>
    <path d="M-86-68 Q-72-126 0-133 Q72-126 86-68" fill="none" stroke="#00FF9C" stroke-opacity=".6" stroke-width="2"/>

    <!-- Side Sensor Fins -->
    <path d="M-105-48L-139-70L-132 22L-99 37M105-48L139-70L132 22L99 37"
          fill="#091A11" stroke="#00A86B" stroke-width="2"/>

    <!-- Face Visor Plate -->
    <path d="M-76-42 Q0-82 76-42 L65 58 Q48 106 0 116 Q-48 106-65 58Z"
          fill="#06120B" stroke="#00FF9C" stroke-width="2"/>

    <!-- Tactical Visor Eyes -->
    <path d="M-54 5Q-34-17-13 5Q-34 28-54 5ZM13 5Q34-17 54 5Q34 28 13 5Z"
          fill="#00FF9C" filter="url(#soft)">
      <animate attributeName="opacity" values="1;1;.15;1;1" keyTimes="0;0.43;0.47;0.51;1" dur="5s" repeatCount="indefinite"/>
    </path>
    <circle cx="-34" cy="5" r="5" fill="#040E08"/>
    <circle cx="34" cy="5" r="5" fill="#040E08"/>
    <path d="M-18 67Q0 80 18 67" fill="none" stroke="#00FF9C" stroke-width="3" stroke-linecap="round"/>

    <!-- Forehead Cursed Energy Core -->
    <circle cy="-92" r="13" fill="url(#core)" filter="url(#glow)">
      <animate attributeName="r" values="11;14;11" dur="2.2s" repeatCount="indefinite"/>
    </circle>

    <!-- Holographic Base Pedestal -->
    <path d="M-45 127L-58 157Q0 180 58 157L45 127" fill="#091B12" stroke="#00FF9C" stroke-width="2"/>
    <ellipse cy="174" rx="94" ry="18" fill="#00FF9C" opacity=".12" filter="url(#glow)"/>
    <ellipse cy="174" rx="74" ry="10" fill="none" stroke="#00FF9C" stroke-width="2"/>
    <path d="M-130 195H130" stroke="#00A86B" stroke-opacity=".6"/>
    <circle cx="-130" cy="195" r="4" fill="#00FF9C"/>
    <circle cx="130" cy="195" r="4" fill="#00A86B"/>

    <!-- Floating Mission Data Orbs -->
    <circle cx="-160" cy="-115" r="4" fill="#00FF9C"><animate attributeName="cy" values="-115;-130;-115" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="155" cy="100" r="4" fill="#00A86B"><animate attributeName="cy" values="100;84;100" dur="3.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Left-Side Operator Identity Box -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <rect x="70" y="555" width="500" height="54" rx="12" fill="#091811" stroke="#00A86B" stroke-opacity=".7"/>
    <text x="92" y="578" fill="#00FF9C" font-size="13" font-weight="800" letter-spacing="1.5">GHOST  //  TACTICAL AI COMPANION</text>
    <text x="92" y="597" fill="#84928A" font-size="13">Autonomous Profile Companion • 9 Click-Only Intel Categories</text>
  </g>

  <!-- Right-Side Directive Briefing Panel -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <rect x="650" y="150" width="780" height="420" rx="18" fill="#0B1A12" fill-opacity=".92" stroke="#163825" stroke-width="1.5"/>
    <path d="M650 194H1430" stroke="#00A86B" stroke-opacity=".4"/>
    <text x="685" y="181" fill="#00FF9C" font-size="13" font-weight="800" letter-spacing="1.6">MISSION BRIEFING  //  DIRECTIVE UPLINK</text>
    <text x="690" y="247" fill="#D5DED8" font-size="30" font-weight="800">GHOST Interface Ready.</text>
    <text x="690" y="282" fill="#84928A" font-size="17">Direct mission intelligence for Naitik's architecture, projects, and skills.</text>

    <!-- Interactive Intel Status Block -->
    <rect x="685" y="315" width="710" height="93" rx="12" fill="#07120C" stroke="#183D28"/>
    <text x="710" y="345" fill="#00FF9C" font-size="13" font-weight="800" letter-spacing="1.2">CONTROLLED KNOWLEDGE ENGINE</text>
    <text x="710" y="375" fill="#D5DED8" font-size="16">About  •  Education  •  Skills  •  Projects  •  Achievements  •  Contact</text>
    <text x="710" y="397" fill="#84928A" font-size="13.5">Deterministic click-only architecture. Hosted 24/7 on Render cloud.</text>

    <!-- Telemetry Cards -->
    <g>
      <rect x="685" y="430" width="218" height="82" rx="11" fill="#08140D" stroke="#1A3E2A"/>
      <text x="706" y="458" fill="#84928A" font-size="12" font-weight="700" letter-spacing="1">STATUS</text>
      <text x="706" y="487" fill="#D5DED8" font-size="18" font-weight="800">ACTIVE</text>
      <circle cx="866" cy="478" r="5" fill="#00FF9C"><animate attributeName="opacity" values="1;.3;1" dur="1.4s" repeatCount="indefinite"/></circle>
    </g>
    <g>
      <rect x="921" y="430" width="218" height="82" rx="11" fill="#08140D" stroke="#1A3E2A"/>
      <text x="942" y="458" fill="#84928A" font-size="12" font-weight="700" letter-spacing="1">CATEGORIES</text>
      <text x="942" y="487" fill="#D5DED8" font-size="18" font-weight="800">9 DIRECTIVES</text>
      <path d="M1093 478h20m-7-7 7 7-7 7" fill="none" stroke="#00FF9C" stroke-width="2"/>
    </g>
    <g>
      <rect x="1157" y="430" width="238" height="82" rx="11" fill="#08140D" stroke="#1A3E2A"/>
      <text x="1178" y="458" fill="#84928A" font-size="12" font-weight="700" letter-spacing="1">PLATFORM</text>
      <text x="1178" y="487" fill="#D5DED8" font-size="18" font-weight="800">RENDER 24/7</text>
      <path d="M1350 487l10-17 10 17z" fill="none" stroke="#00A86B" stroke-width="2"/>
    </g>
  </g>

  <!-- Audio Equalizer / Telemetry Waveform -->
  <g transform="translate(690 535)" stroke="#00FF9C" stroke-width="2" stroke-linecap="round" opacity=".85">
    <path d="M0 0v8 M10 -4v16 M20 -8v24 M30 -3v14 M40 -11v30 M50 -5v18 M60 -2v12 M70 -9v26 M80 -4v16 M90 -12v32 M100 -5v18 M110 -2v12 M120 -8v24 M130 -4v16 M140 0v8">
      <animate attributeName="opacity" values=".35;1;.35" dur="1.3s" repeatCount="indefinite"/>
    </path>
  </g>
  <text x="850" y="541" fill="#84928A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" letter-spacing=".7">TELEMETRY STABLE  •  CLICK LAUNCHER BELOW TO COMMENCE COMMS</text>
  <rect x="7" y="7" width="1486" height="636" rx="23" fill="none" stroke="url(#bright-line)" stroke-width="2.5"/>
</g>
</svg>