<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="dev-title dev-desc">
  <title id="dev-title">NAITIK.EXE — Developer RPG Character Card (Emerald Killer)</title>
  <desc id="dev-desc">A dark anime pixel-inspired developer character with emerald cursed energy, tactical status panel, and quest indicators.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080A09"/>
      <stop offset=".55" stop-color="#10251A"/>
      <stop offset="1" stop-color="#040E08"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" x2="1">
      <stop offset="0" stop-color="#00A86B"/>
      <stop offset="1" stop-color="#00FF9C"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#00A86B" stroke-width="1" opacity=".18"/>
    </pattern>
    <clipPath id="round">
      <rect x="8" y="8" width="1184" height="404" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect x="8" y="8" width="1184" height="404" rx="20" fill="url(#bg)" stroke="#00A86B" stroke-width="2" stroke-opacity=".6"/>
    <rect x="8" y="8" width="1184" height="404" fill="url(#grid)"/>
    <path d="M0 92H1200 M0 330H1200" stroke="#00FF9C" opacity=".15"/>
    <path d="M24 24H330 M870 396H1176" stroke="url(#emerald)" stroke-width="2" opacity=".8"/>
    <circle cx="1020" cy="100" r="150" fill="#00A86B" opacity=".08">
      <animate attributeName="r" values="130;165;130" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="300" r="120" fill="#00FF9C" opacity=".06">
      <animate attributeName="r" values="100;135;100" dur="6s" repeatCount="indefinite"/>
    </circle>

    <!-- HUD corners -->
    <g fill="none" stroke="#00FF9C" stroke-width="2" opacity=".85">
      <path d="M28 62V28H62 M1138 28H1172V62 M28 358V392H62 M1138 392H1172V358"/>
    </g>

    <!-- Character platform -->
    <ellipse cx="270" cy="346" rx="132" ry="18" fill="#00FF9C" opacity=".12" filter="url(#glow)">
      <animate attributeName="opacity" values=".08;.24;.08" dur="2.8s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="270" cy="342" rx="98" ry="8" fill="none" stroke="#00FF9C" stroke-width="2" opacity=".75">
      <animate attributeName="rx" values="88;106;88" dur="3s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Pixel-inspired adventurer (Toji aesthetic) -->
    <g transform="translate(190 112)" shape-rendering="crispEdges">
      <!-- floating hood / hair -->
      <path d="M42 20H116V36H132V68H116V52H42V68H26V36H42Z" fill="#08100C" stroke="#00FF9C" stroke-width="3"/>
      <path d="M42 36H116V68H132V116H116V132H42V116H26V68H42Z" fill="#12241A" stroke="#00A86B" stroke-width="3"/>
      <!-- face -->
      <path d="M50 52H108V112H50Z" fill="#E8C39E"/>
      <path d="M50 52H108V66H50Z" fill="#080A09"/>
      <path d="M58 78H70V88H58Z M90 78H102V88H90Z" fill="#00FF9C" filter="url(#glow)"/>
      <path d="M72 100H88V106H72Z" fill="#00A86B"/>
      <!-- jacket / tactical vest -->
      <path d="M42 132H116L140 158V224H18V158Z" fill="#0C1B12" stroke="#00A86B" stroke-width="3"/>
      <path d="M42 132L78 154L116 132L100 224H58Z" fill="#143021"/>
      <path d="M76 155V220" stroke="#00FF9C" stroke-width="4" filter="url(#glow)"/>
      <path d="M18 172H42V202H18Z M116 172H140V202H116Z" fill="#0C1B12" stroke="#00FF9C" stroke-width="2"/>
      <!-- hands and boots -->
      <path d="M18 202H42V222H18Z M116 202H140V222H116Z" fill="#E8C39E"/>
      <path d="M42 224H70V244H30V234H42Z M88 224H116V234H128V244H88Z" fill="#040E08" stroke="#00FF9C" stroke-width="2"/>
      <path d="M30 238H70 M88 238H128" stroke="#00A86B" stroke-width="4"/>
      <!-- shoulder insignia -->
      <path d="M112 146L126 160L112 174L98 160Z" fill="#00FF9C" opacity=".9"/>
    </g>

    <!-- floating cursed particles -->
    <g fill="#00FF9C" filter="url(#glow)">
      <circle cx="150" cy="115" r="3"><animate attributeName="cy" values="115;92;115" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="390" cy="170" r="2"><animate attributeName="cy" values="170;145;170" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="120" cy="260" r="2"><animate attributeName="cy" values="260;240;260" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="420" cy="290" r="3"><animate attributeName="cy" values="290;268;290" dur="4.5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Main identity -->
    <g font-family="monospace">
      <text x="470" y="72" fill="#00FF9C" font-size="14" letter-spacing="4">PLAYER PROFILE // EMERALD KILLER CLASS</text>
      <text x="466" y="128" fill="#D5DED8" font-size="46" font-weight="700">NAITIK.EXE</text>
      <text x="470" y="160" fill="#00FF9C" font-size="17" letter-spacing="1">FULL STACK DEVELOPER  •  AI/ML EXPLORER</text>
      <path d="M470 181H1110" stroke="#00A86B" stroke-width="1.5" stroke-opacity=".4"/>
      <text x="470" y="216" fill="#84928A" font-size="14" letter-spacing="2">ACTIVE OBJECTIVE</text>
      <text x="470" y="246" fill="#D5DED8" font-size="22">Think. Build. Break. Learn. Repeat.</text>
      <text x="470" y="280" fill="#84928A" font-size="15">Explore new skills • Create useful products • Level up</text>

      <!-- Quest chips -->
      <rect x="470" y="306" width="170" height="36" rx="8" fill="#0D2418" stroke="#00FF9C"/>
      <text x="555" y="329" fill="#00FF9C" font-size="13" text-anchor="middle" font-weight="700">[ QUEST: ACTIVE ]</text>
      <rect x="654" y="306" width="170" height="36" rx="8" fill="#091A11" stroke="#00A86B"/>
      <text x="739" y="329" fill="#D5DED8" font-size="13" text-anchor="middle" font-weight="700">[ CLASS: BUILDER ]</text>
      <rect x="838" y="306" width="170" height="36" rx="8" fill="#08140D" stroke="#00A86B" stroke-opacity=".7"/>
      <text x="923" y="329" fill="#84928A" font-size="13" text-anchor="middle" font-weight="700">[ MODE: LEARNING ]</text>
    </g>

    <!-- scan beam -->
    <rect x="10" y="8" width="1180" height="3" fill="#00FF9C" opacity=".25" filter="url(#glow)">
      <animate attributeName="y" values="8;408;8" dur="9s" repeatCount="indefinite"/>
    </rect>
    <text x="1080" y="382" fill="#84928A" font-family="monospace" font-size="11" text-anchor="end">SYSTEM ONLINE // TOJI PROTOCOL</text>
  </g>
</svg>